// shairport-sync 4.3 settings for the Music API (run as a systemd user unit by deploy/run-airplay.sh, which also
// sets the advertised name from AIRPLAY_NAME). See the full sample: scripts/shairport-sync.conf upstream.
general =
{
	name = "Pinewood Music";
	output_backend = "pa";
	mdns_backend = "avahi";
};

sessioncontrol =
{
	active_state_timeout = 10.0;
	session_timeout = 20;
};

pa =
{
	application_name = "AirPlay";
};

metadata =
{
	enabled = "yes";
	include_cover_art = "yes";
	cover_art_cache_directory = "";
	pipe_name = "/tmp/shairport-sync-metadata";
	pipe_timeout = 5000;
	progress_interval = 1.0;
};
