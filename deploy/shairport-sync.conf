// shairport-sync 5.6 settings for the Music API (run as a systemd user unit by deploy/run-airplay.sh, which also sets
// the advertised name from AIRPLAY_NAME). See the full sample: scripts/shairport-sync.conf upstream.
general =
{
	name = "PEARL Speakers";
	output_backend = "pulseaudio";
	mdns_backend = "avahi";
	dbus_service_bus = "session";
};

sessioncontrol =
{
	// An AirPlay 2 pause ends activity at once though the sender stays connected. The server ends the session and
	// resumes Spotify on aend, so this is how long someone can pause AirPlay before the speakers go back to Spotify.
	active_state_timeout = 120.0;
	session_timeout = 20;
};

// airplay.py finds this stream by its application name.
pulseaudio =
{
	application_name = "AirPlay";
};

metadata =
{
	enabled = "yes";
	include_cover_art = "yes";
	cover_art_cache_directory = "/tmp/shairport-sync-cover-art";
	pipe_name = "/tmp/shairport-sync-metadata";
	pipe_timeout = 5000;
	// airplay.py marks the session playing again from phbt if a flush isn't followed by a resume item.
	progress_interval = 1.0;
};
