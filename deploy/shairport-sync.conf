// shairport-sync settings for the Music API (run as a systemd user unit by deploy/run-airplay.sh, which also sets
// the advertised name from AIRPLAY_NAME). Written for 3.3 and 4.3, the distro package versions. See the full sample:
// scripts/shairport-sync.conf upstream.
general =
{
	name = "PEARL Speakers";
	// Ignored by builds without AirPlay 2, which are classic anyway (the distro packages).
	service_type = "classic";
	output_backend = "pa";
	mdns_backend = "avahi";
	dbus_service_bus = "session";
};

sessioncontrol =
{
	active_state_timeout = 10.0;
	session_timeout = 20;
};

pa =
{
	application_name = "AirPlay";
};

metadata =
{
	enabled = "yes";
	include_cover_art = "yes";
	cover_art_cache_directory = "";
	pipe_name = "/tmp/shairport-sync-metadata";
	pipe_timeout = 5000;
};
